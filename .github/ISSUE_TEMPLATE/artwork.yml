name: Cover / banner
description: Send a new or better cover or banner for a game or tool
title: "[Artwork] "
labels: ["artwork"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Once the image is approved it goes live on the site automatically.

        <img src="https://archipelagolibrary.com/assets/artwork-guide.png" width="380" alt="Cover: vertical 2:3, 600×900 (min 400×600). Banner: wide, about 3:1, 1920×620 (min 1280×420). Other shapes get cropped from the centre.">

        Other shapes get cropped from the centre, so keep logos and characters away from the edges. Please send sharp originals: no upscaled or blurry images, no watermarks.
        PNG, JPG or WEBP, max 5 MB. Drag the image into the box below, or paste a direct link to the image (for example from SteamGridDB: right click on the image → Copy image address).
  - type: input
    id: name
    attributes:
      label: Name
      description: Exactly as shown on the site
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Page
      options:
        - Game
        - Tool
    validations:
      required: true
  - type: textarea
    id: cover
    attributes:
      label: Cover
      description: "Vertical 2:3, ideally 600×900. Drop the image here (leave empty if you're only sending a banner)"
  - type: textarea
    id: banner
    attributes:
      label: Banner
      description: "Wide, about 3:1, ideally 1920×620. Drop the image here (leave empty if you're only sending a cover)"
  - type: input
    id: credit
    attributes:
      label: Credit name
      description: How you'd like to be credited in the commit (leave empty to use your GitHub username)
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional, e.g. "the current cover is from the wrong game"
